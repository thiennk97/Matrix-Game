<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Battle - Realtime Server Engine</title>
    <script src="/js/bootstrap.js?v=1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/css/style.css?v=91" />
  </head>
  <body>
    <header>
      <div class="logo" id="header-logo" style="cursor: pointer">
        <svg
          width="300"
          height="40"
          viewBox="0 0 300 40"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="logo-svg"
        >
          <g transform="translate(0, 5)">
            <rect x="0" y="0" width="8" height="8" rx="2" fill="#FF9F1C" />
            <rect x="11" y="0" width="8" height="8" rx="2" fill="#FFBF69" />
            <rect x="22" y="0" width="8" height="8" rx="2" fill="#FF9F1C" />
            <rect x="0" y="11" width="8" height="8" rx="2" fill="#FFBF69" />
            <rect x="11" y="11" width="8" height="8" rx="2" fill="#FF9F1C" />
            <rect x="22" y="11" width="8" height="8" rx="2" fill="#FFBF69" />
            <rect x="0" y="22" width="8" height="8" rx="2" fill="#FF9F1C" />
            <rect x="11" y="22" width="8" height="8" rx="2" fill="#FFBF69" />
            <rect x="22" y="22" width="8" height="8" rx="2" fill="#FF9F1C" />
          </g>
          <text
            x="45"
            y="27"
            font-family="'Orbitron', sans-serif"
            font-weight="900"
            font-size="24"
            fill="url(#logoGrad)"
            letter-spacing="2"
          >
            MATRIX
          </text>
          <text
            x="160"
            y="27"
            font-family="'Orbitron', sans-serif"
            font-weight="900"
            font-size="24"
            fill="#FFFFFF"
            letter-spacing="1"
          >
            PONOS
          </text>
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF9F1C" />
              <stop offset="100%" stop-color="#FFBF69" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </header>

    <div id="view-index" class="app-view">
      <div class="index-header">
        <h2>Phòng Đang Chờ</h2>
        <button class="btn btn-primary" id="btn-show-create-room">
          <i data-lucide="plus" class="icon"></i> TẠO PHÒNG MỚI
        </button>
      </div>

      <div id="public-rooms-container" class="public-rooms-grid"></div>
    </div>

    <div id="view-game" class="app-view" style="display: none">
      <div class="room-session-actions">
        <button class="btn btn-sm btn-primary" id="btn-restart-game" style="display: none">
          <i data-lucide="rotate-ccw" class="icon"></i> Đấu ván mới
        </button>
        <button class="btn btn-sm btn-muted" id="btn-leave-room">
          <i data-lucide="log-out" class="icon"></i> Thoát phòng
        </button>
      </div>
      <div class="main-layout">
        <aside class="panel-section leaderboard-panel" id="leaderboard-panel">
          <div class="panel-title">
            <span><i data-lucide="trophy" class="icon"></i> Bảng Xếp Hạng</span>
          </div>
          <div class="match-list" id="match-list-details">
            <div class="match-list-empty">Đang tải...</div>
          </div>
        </aside>

        <div class="game-area">
          <div class="panel-section board-card">
            <div class="board-main">
              <div id="game-pause-overlay" class="game-pause-overlay" style="display: none">
                <h2><i data-lucide="pause-circle" class="icon"></i> TRẬN ĐẤU BỊ TẠM DỪNG</h2>
                <p>Đang chờ người chơi kết nối lại...</p>
              </div>

              <div id="room-waiting-overlay" class="room-waiting-overlay" style="display: none">
                <div class="lobby-room-view">
                  <div class="lobby-room-header">
                    <div class="lobby-room-code">
                      <span>MÃ PHÒNG:</span>
                      <strong id="current-room-code-text"></strong>
                      <button
                        class="btn btn-sm btn-muted"
                        id="btn-copy-link"
                        title="Sao chép link mời"
                        aria-label="Sao chép link mời"
                      >
                        <i data-lucide="link" class="icon"></i>
                      </button>
                    </div>
                  </div>

                  <div class="lobby-players-grid" id="lobby-players-grid"></div>

                  <div class="timer-select-group" id="timer-setting-group">
                    <label> <i data-lucide="timer" class="icon"></i> Thời gian mỗi lượt </label>
                    <select id="timer-select">
                      <option value="5">5 giây</option>
                      <option value="8" selected>8 giây</option>
                      <option value="10">10 giây</option>
                      <option value="15">15 giây</option>
                    </select>
                  </div>

                  <div class="lobby-room-buttons">
                    <button class="btn btn-green" id="btn-toggle-ready">
                      <i data-lucide="zap" class="icon"></i> SẴN SÀNG
                    </button>
                    <button class="btn btn-primary" id="btn-start-game-server">
                      <i data-lucide="rocket" class="icon"></i> BẮT ĐẦU GAME
                    </button>
                  </div>
                </div>
              </div>

              <div class="board-timer-bar" id="board-timer-bar">
                <span id="timer-text-val" class="timer-value">8.0s</span>
                <div class="timer-bar-container">
                  <div class="timer-bar-fill" id="timer-bar-fill"></div>
                </div>
              </div>
              <div class="board-container" style="display: flex; gap: var(--space-5)">
                <div class="board-wrapper">
                  <div id="pixi-board-container" class="pixi-board-container"></div>
                </div>

                <div class="piece-panel" id="piece-panel">
                  <div class="current-piece-vertical" id="current-piece-display"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel-section chat-panel" id="chat-widget">
          <div class="panel-title chat-header" id="chat-header">
            <span><i data-lucide="message-circle" class="icon"></i> Chat Nhóm</span>
            <i data-lucide="chevron-down" class="icon" id="chat-toggle-icon"></i>
          </div>
          <div class="chat-body" id="chat-body">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
              <input
                type="text"
                id="chat-input"
                placeholder="Nhập tin nhắn..."
                autocomplete="off"
                maxlength="100"
              />
              <button id="btn-send-chat" aria-label="Gửi">
                <i data-lucide="send" class="icon"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-section wide-section" id="opponents-section" style="display: none">
        <div class="panel-title">
          <span><i data-lucide="eye" class="icon"></i> Bàn Đối Thủ</span>
        </div>
        <div class="opponents-boards-container" id="opponents-boards-container"></div>
      </div>
    </div>

    <div class="modal-overlay" id="name-modal" style="display: none">
      <div class="modal-card">
        <button id="btn-close-name-modal" class="modal-close-btn">
          <i data-lucide="x" class="icon"></i>
        </button>
        <div class="modal-title" id="name-modal-title">THAM GIA PHÒNG</div>
        <p
          id="name-modal-desc"
          style="
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
          "
        ></p>
        <div class="form-field">
          <input
            type="text"
            id="name-modal-input"
            class="text-input"
            placeholder="Nhập tên của bạn..."
            autocomplete="off"
            maxlength="24"
            required
          />
        </div>
        <button class="btn btn-cyan btn-lg" id="btn-name-modal-submit">
          <i data-lucide="check" class="icon"></i> XÁC NHẬN
        </button>
      </div>
    </div>

    <div class="modal-overlay" id="victory-modal" style="display: none">
      <div class="modal-card victory-modal-card">
        <button id="btn-close-victory" class="modal-close-btn">
          <i data-lucide="x" class="icon"></i>
        </button>
        <div class="modal-title" id="modal-winner">
          <i data-lucide="trophy" class="icon"></i> MATRIX WINNER!
        </div>
        <div class="modal-scores" id="modal-scores"></div>
        <div
          class="modal-buttons"
          style="display: flex; gap: 10px; justify-content: center; margin-top: var(--space-4)"
        >
          <button class="btn btn-muted" id="btn-modal-leave">
            <i data-lucide="log-out" class="icon"></i> Thoát Phòng
          </button>
          <button class="btn btn-primary" id="btn-modal-restart">
            <i data-lucide="rotate-ccw" class="icon"></i> Đấu Ván Mới
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="/js/config/constants.js"></script>
    <script src="/js/config/icons.js"></script>
    <script src="/js/ui/pixi-board.js?v=79"></script>
    <script src="/js/ui/lobby.js?v=79"></script>
    <script src="/js/ui/hud.js?v=77"></script>
    <script src="/js/ui/opponents.js?v=70"></script>
    <script src="/js/core/game.js?v=79"></script>
    <script src="/js/network/app.js?v=83"></script>
  </body>
</html>
